name: Background tick (Vercel)
# Vercel's free plan runs its own cron once a day; this calls the same pass every hour, so watchdogs,
# reminders and the outbox keep moving. Needs two repository secrets: APP_URL and CRON_SECRET.
# Without them it does nothing. Stop it when the always-on worker runs on our own server.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET not set: skipped"; exit 0; fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/tick"
